<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Demo website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/* ---------- BRAND TOKENS: change these per prospect (from their logo / bakkie / signboard) ---------- */
:root{
  --brand:#23485A;      /* their main colour: headings, top bar, slip header */
  --brand-2:#3E6B7E;    /* a lighter step of it */
  --mark:#E8B23A;       /* the "tape measure" colour: ticks + the main button. Use their accent if they have one */
  --mark-ink:#1C2226;   /* text on --mark */
  --paper:#EDEFEC;      /* page background: cool concrete, not cream */
  --ink:#1C2226;
  --muted:#59636A;
  --line:#C6CCC8;
  --white:#FBFCFB;
}
/* ---------- base ---------- */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 "Archivo",system-ui,sans-serif;font-stretch:100%}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:3px}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-stretch:68%;font-weight:850;line-height:.98;letter-spacing:-.005em;margin:0;color:var(--brand)}
h1{font-size:clamp(44px,6.4vw,84px)}
h2{font-size:clamp(34px,4.6vw,58px)}
h3{font-size:24px;line-height:1.1}
p{margin:0}
.lead{font-size:clamp(18px,1.6vw,21px);color:var(--muted);max-width:56ch}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:4px;padding:15px 22px;font:750 17px "Archivo",sans-serif;font-stretch:90%;text-decoration:none;cursor:pointer}
.btn-mark{background:var(--mark);color:var(--mark-ink)}
.btn-mark:hover{filter:brightness(1.05)}
.btn-line{background:transparent;color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.wa-ico{width:20px;height:20px;flex:none}

/* the tape-measure: the one motif. Ticks every 8px, a long tick every 40px */
.tape{height:18px;background:
  repeating-linear-gradient(90deg,var(--mark) 0 2px,transparent 2px 40px) top left/100% 18px no-repeat,
  repeating-linear-gradient(90deg,var(--mark) 0 2px,transparent 2px 8px) top left/100% 9px no-repeat;opacity:.95}

/* demo bar */
.demo-note{background:var(--ink);color:#e9ece9;font-size:14px;text-align:center;padding:8px 16px}
.demo-note a{color:var(--mark)}
.sample-note{background:var(--mark);color:var(--mark-ink);font-size:14px;text-align:center;padding:6px 16px;font-weight:650}

/* header */
header{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.wordmark{font-weight:900;font-stretch:72%;font-size:26px;color:var(--brand);text-decoration:none;line-height:1}
.logo img{max-height:52px;width:auto}
.head-right{display:flex;align-items:center;gap:18px}
.head-phone{font-weight:700;text-decoration:none;color:var(--brand);white-space:nowrap}
.head .btn{padding:11px 16px;font-size:15px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:min(78vh,720px);background:var(--white)}
.hero-text{padding:clamp(36px,6vw,84px) clamp(16px,4vw,56px) 40px max(16px,calc((100vw - 1180px)/2));display:flex;flex-direction:column;justify-content:center;gap:24px}
.hero-meta{font-size:15px;color:var(--muted);font-weight:600}
.need{margin-top:6px}
.need p{font-weight:750;font-stretch:85%;font-size:18px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--brand);background:transparent;color:var(--brand);border-radius:999px;padding:9px 15px;font:650 15px "Archivo",sans-serif;cursor:pointer}
.chip:hover,.chip[aria-pressed=true]{background:var(--brand);color:#fff}
.hero-photo{position:relative;min-height:340px}
.hero-photo .ph,.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dim{position:absolute;left:24px;right:24px;bottom:22px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:650;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.dim::before,.dim::after{content:"";flex:1;height:2px;background:var(--mark);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.dim span{background:rgba(28,34,38,.72);padding:5px 10px;border-radius:3px;text-shadow:none}
.dim i{position:absolute;top:50%;width:2px;height:16px;background:var(--mark);transform:translateY(-50%)}
.dim i:first-child{left:0}.dim i:last-child{right:0}

/* photo placeholder: an architect's hatch, so the template looks intentional before real photos go in */
.ph{background:
  repeating-linear-gradient(135deg,transparent 0 11px,rgba(35,72,90,.13) 11px 12px),
  linear-gradient(var(--white),var(--white));
  display:grid;place-items:center;text-align:center;color:var(--brand);font-weight:650;font-size:15px;padding:16px;border:1px dashed var(--brand-2)}

/* proof line */
.proof{background:var(--brand);color:#fff}
.proof .wrap{display:flex;flex-wrap:wrap;gap:12px 40px;padding:18px 0;align-items:center;font-weight:600}
.proof b{font-stretch:75%;font-size:24px;font-weight:850;color:var(--mark);margin-right:6px}
.proof a{color:#fff}

section{padding:clamp(56px,8vw,104px) 0}
.sec-head{display:grid;gap:14px;margin-bottom:36px;max-width:760px}

/* work */
.work-grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:150px;gap:10px}
.work-grid figure{margin:0;position:relative;overflow:hidden;border-radius:3px;background:var(--white)}
.work-grid figure:nth-child(1){grid-column:span 4;grid-row:span 3}
.work-grid figure:nth-child(2){grid-column:span 2;grid-row:span 2}
.work-grid figure:nth-child(3){grid-column:span 2;grid-row:span 1}
.work-grid figure:nth-child(4){grid-column:span 3;grid-row:span 2}
.work-grid figure:nth-child(5){grid-column:span 3;grid-row:span 2}
.work-grid figure:nth-child(n+6){grid-column:span 2;grid-row:span 2}
.work-grid img,.work-grid .ph{width:100%;height:100%;object-fit:cover}
.work-grid figcaption{position:absolute;left:0;bottom:0;background:rgba(28,34,38,.78);color:#fff;font-size:14px;padding:6px 10px;border-top-right-radius:3px}
.work-grid .ph+figcaption{display:none}

/* services: a spec list, not cards */
.services{background:var(--white)}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:0 56px}
.svc li{list-style:none;display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:start;padding:22px 0;border-top:2px solid var(--brand)}
.svc h3{grid-column:1}
.svc p{grid-column:1;color:var(--muted)}
.svc button{grid-column:2;grid-row:1/span 2;align-self:center;background:none;border:0;color:var(--brand);font:700 15px "Archivo",sans-serif;text-decoration:underline;text-underline-offset:4px;cursor:pointer;padding:6px 0}
.svc ul{margin:0;padding:0;display:contents}

/* steps: real sequence, so numbers are earned */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;counter-reset:s}
.steps div{counter-increment:s;border-left:2px solid var(--mark);padding:2px 0 2px 18px}
.steps div::before{content:counter(s);display:block;font-weight:900;font-stretch:65%;font-size:44px;line-height:1;color:var(--mark);margin-bottom:10px}
.steps p{color:var(--muted);margin-top:6px}

/* QUOTE SLIP — the bold element */
.quote{background:var(--brand);color:#fff}
.quote h2{color:#fff}
.quote .lead{color:#d7e2e6}
.quote-grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(24px,4vw,56px);align-items:start}
.form{display:grid;gap:22px}
fieldset{border:0;margin:0;padding:0}
legend,.flabel{font-weight:750;font-stretch:85%;font-size:18px;margin-bottom:10px;padding:0;display:block}
.form .chip{border-color:#fff;color:#fff}
.form .chip:hover,.form .chip[aria-pressed=true]{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.form input,.form textarea{width:100%;border:0;border-bottom:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.07);color:#fff;font:400 17px "Archivo",sans-serif;padding:12px 12px;border-radius:3px 3px 0 0}
.form input::placeholder,.form textarea::placeholder{color:rgba(255,255,255,.55)}
.form input:focus,.form textarea:focus{border-bottom-color:var(--mark);outline:none;background:rgba(255,255,255,.12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.slip{background:var(--white);color:var(--ink);border-radius:3px;position:sticky;top:96px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.slip-top{background:var(--mark);color:var(--mark-ink);padding:14px 20px;display:flex;justify-content:space-between;gap:12px;font-weight:750;font-stretch:85%}
.slip-body{padding:20px;display:grid;gap:14px}
.slip pre{margin:0;white-space:pre-wrap;font:400 16px/1.5 "Archivo",sans-serif;min-height:150px;background:#E7F3E5;border-radius:8px 8px 8px 2px;padding:14px 16px}
.slip small{color:var(--muted);font-size:14px}
.slip .btn{justify-content:center;width:100%}
.slip-perf{height:12px;background:radial-gradient(circle at 6px -2px,var(--brand) 6px,transparent 6.5px) 0 0/16px 12px repeat-x}

/* areas + review + contact */
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.areas{display:flex;flex-wrap:wrap;gap:6px 0;margin:14px 0 0;padding:0;list-style:none;font-weight:650;font-stretch:80%;font-size:22px;color:var(--brand)}
.areas li:not(:last-child)::after{content:"/";color:var(--mark);margin:0 10px;font-weight:900}
blockquote{margin:14px 0 0;font-size:21px;line-height:1.45}
blockquote cite{display:block;font-style:normal;color:var(--muted);font-size:15px;margin-top:10px}
.hours{width:100%;border-collapse:collapse;margin-top:14px}
.hours td{padding:8px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;font-weight:650}
.contact-lines{margin-top:16px;display:grid;gap:6px;font-weight:650}

footer{background:var(--ink);color:#c9d0cc;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:space-between;padding:24px 0}

/* Zara chat */
.zara-btn{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 18px 10px 10px;font:700 15px "Archivo",sans-serif;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.zara-btn i{width:36px;height:36px;border-radius:50%;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-style:normal;font-weight:900}
.chat{position:fixed;right:20px;bottom:86px;z-index:41;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 120px));background:var(--white);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.3);display:none;flex-direction:column;overflow:hidden}
.chat.open{display:flex}
.chat-top{background:var(--brand);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.chat-top small{display:block;opacity:.8;font-size:13px}
.chat-top button{background:none;border:0;color:#fff;font-size:26px;cursor:pointer;line-height:1}
.log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#F3F5F3}
.msg{max-width:84%;padding:10px 13px;border-radius:12px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.msg.z{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
.msg.u{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 0}
.quick button{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:999px;padding:6px 11px;font:600 13px "Archivo",sans-serif;cursor:pointer}
.ask{display:flex;gap:8px;padding:10px 12px}
.ask input{flex:1;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font:16px "Archivo",sans-serif}
.ask button{border:0;background:var(--mark);color:var(--mark-ink);border-radius:999px;padding:0 16px;font:700 15px "Archivo",sans-serif;cursor:pointer}
.chat-note{font-size:12px;color:var(--muted);text-align:center;padding:0 0 8px}

/* responsive */
@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .hero-photo{min-height:300px;order:-1}
  .hero-text{padding:28px 16px 36px}
  .svc{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr 1fr}
  .quote-grid{grid-template-columns:1fr}
  .slip{position:static}
  .info-grid{grid-template-columns:1fr}
  .work-grid{grid-template-columns:1fr 1fr;grid-auto-rows:140px}
  .work-grid figure:nth-child(n){grid-column:span 1;grid-row:span 1}
  .work-grid figure:nth-child(1){grid-column:span 2;grid-row:span 2}
}
@media (max-width:560px){
  .wordmark{font-size:20px}
  .head-phone{display:none}
  .steps{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .zara-btn span{display:none}
  .zara-btn{padding:10px}
}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app"></div>

<button class="zara-btn" id="zaraOpen" aria-expanded="false" aria-controls="chat"><i>Z</i><span id="zaraLbl">Ask Zara</span></button>
<div class="chat" id="chat" role="dialog" aria-label="Chat with Zara">
  <div class="chat-top"><div><b id="chatTitle">Zara</b><small id="chatSub"></small></div><button id="zaraClose" aria-label="Close chat">×</button></div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="quick" id="quick"></div>
  <form class="ask" id="ask"><input id="askIn" autocomplete="off" aria-label="Type a question"><button id="askBtn">Send</button></form>
  <div class="chat-note" id="chatNote"></div>
</div>

<script>
const S = window.SITE, $ = s => document.querySelector(s);
const T = {
  en:{quote:"Get a quote",need:"What needs doing?",call:"Call",work:"Recent work",workSub:"Real jobs, photographed on site.",services:"What we do",ask:"Ask about this",how:"How a job runs",
      qTitle:"Get a quote on WhatsApp",qLead:"Fill in what you can. It turns into a WhatsApp message to "+S.owner+", so nothing gets lost.",job:"The job",where:"Where is it?",wherePh:"Suburb or town",when:"When do you need it?",
      name:"Your name",namePh:"Name",details:"Anything else?",detailsPh:"Rough sizes, what's there now, what you'd like",slipTop:"Your message",send:"Send on WhatsApp",
      areas:"Where we work",said:"What a client said",hoursT:"Hours and contact",rating:"on Google",reviews:"reviews",since:"Since",
      demo:"A demo website Hello Zara designed for "+S.owner+" at "+S.name+". Nothing here is live until he or she says so.",
      sample:"TEMPLATE PREVIEW: sample business, placeholder photos. Each prospect gets their own name, colours and real photos.",
      askZara:"Ask Zara",chatSub:S.owner+"'s assistant (demo)",chatNote:"Demo chat by Hello Zara",typeQ:"Type a question",sendB:"Send",
      hi:"Hi! I'm Zara, "+S.owner+"'s assistant at "+S.short+". I can start a quote for you or answer a quick question, any time of day.",
      qQuote:"Get a quote",qArea:"Do you come to me?",qHours:"When are you open?",qPrice:"How much?"},
  af:{quote:"Kry 'n kwotasie",need:"Wat moet gedoen word?",call:"Bel",work:"Onlangse werk",workSub:"Regte werk, op die perseel afgeneem.",services:"Wat ons doen",ask:"Vra hieroor",how:"Hoe 'n werk verloop",
      qTitle:"Kry 'n kwotasie op WhatsApp",qLead:"Vul in wat jy kan. Dit word 'n WhatsApp-boodskap aan "+S.owner+", so niks raak weg nie.",job:"Die werk",where:"Waar is dit?",wherePh:"Voorstad of dorp",when:"Wanneer het jy dit nodig?",
      name:"Jou naam",namePh:"Naam",details:"Nog iets?",detailsPh:"Rowwe mates, wat is daar nou, wat jy graag wil hê",slipTop:"Jou boodskap",send:"Stuur op WhatsApp",
      areas:"Waar ons werk",said:"Wat 'n kliënt gesê het",hoursT:"Ure en kontak",rating:"op Google",reviews:"resensies",since:"Sedert",
      demo:"'n Demo-webwerf wat Hello Zara vir "+S.owner+" by "+S.name+" ontwerp het. Niks hier is lewendig voordat hy of sy ja sê nie.",
      sample:"SJABLOON-VOORSKOU: voorbeeld-besigheid, plekhouer-foto's. Elke prospek kry hul eie naam, kleure en regte foto's.",
      askZara:"Vra vir Zara",chatSub:S.owner+" se assistent (demo)",chatNote:"Demo-klets deur Hello Zara",typeQ:"Tik 'n vraag",sendB:"Stuur",
      hi:"Hallo! Ek is Zara, "+S.owner+" se assistent by "+S.short+". Ek kan vir jou 'n kwotasie begin of 'n vinnige vraag beantwoord, enige tyd van die dag.",
      qQuote:"Kry 'n kwotasie",qArea:"Kom julle na my toe?",qHours:"Wanneer is julle oop?",qPrice:"Hoeveel kos dit?"}
}[S.lang||"en"];
document.documentElement.lang = S.lang==="af"?"af":"en";
document.title = S.name + (S.demo?" — demo":"");

const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pic = (src,alt,cap) => src ? `<img src="${esc(src)}" alt="${esc(alt)}" loading="lazy">` : `<div class="ph" role="img" aria-label="${esc(cap)}">${esc(cap)}</div>`;
const waIco = `<svg class="wa-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.5-.3z"/></svg>`;
const tel = S.phone ? "tel:+27"+S.phone.replace(/\D/g,"").replace(/^0/,"") : "";

let h = "";
if (S.demo) h += `<div class="demo-note">${esc(T.demo)} <a href="https://hellozara.solutions">hellozara.solutions</a></div>`;
if (S.sample) h += `<div class="sample-note">${esc(T.sample)}</div>`;
h += `<header><div class="wrap head">
  <a class="${S.logo?"logo":"wordmark"}" href="#top">${S.logo?`<img src="${esc(S.logo)}" alt="${esc(S.name)}">`:esc(S.name)}</a>
  <div class="head-right">${S.phone?`<a class="head-phone" href="${tel}">${esc(S.phone)}</a>`:""}<a class="btn btn-mark" href="#quote">${T.quote}</a></div>
</div></header>`;

// hero
h += `<main id="top"><div class="hero">
  <div class="hero-text">
    ${(S.area||S.since)?`<p class="hero-meta">${esc(S.area)}${S.since?` · ${T.since} ${esc(S.since)}`:""}</p>`:""}
    <h1>${esc(S.tagline)}</h1>
    ${S.intro?`<p class="lead">${esc(S.intro)}</p>`:""}
    <div class="need"><p>${T.need}</p><div class="chips">${S.services.map((s,i)=>`<button class="chip" data-svc="${i}">${esc(s.name)}</button>`).join("")}</div></div>
  </div>
  <div class="hero-photo">${pic(S.hero.img,S.name,S.hero.caption)}
    ${S.hero.img && S.hero.caption?`<div class="dim"><i></i><span>${esc(S.hero.caption)}</span><i></i></div>`:""}</div>
</div>
<div class="tape" aria-hidden="true"></div>`;

// proof line — only facts we have
const proof = [];
if (S.google.rating) proof.push(`<span><b>${esc(S.google.rating)}★</b>${S.google.url?`<a href="${esc(S.google.url)}">${T.rating}</a>`:T.rating}${S.google.count?` · ${esc(S.google.count)} ${T.reviews}`:""}</span>`);
if (S.areas.length) proof.push(`<span>${esc(S.areas.slice(0,3).join(", "))}${S.areas.length>3?" …":""}</span>`);
if (S.phone) proof.push(`<span>${T.call} <a href="${tel}">${esc(S.phone)}</a></span>`);
if (proof.length) h += `<div class="proof"><div class="wrap">${proof.join("")}</div></div>`;

// work
if (S.work.length) h += `<section id="work"><div class="wrap">
  <div class="sec-head"><h2>${T.work}</h2><p class="lead">${T.workSub}</p></div>
  <div class="work-grid">${S.work.map(w=>`<figure>${pic(w.img,w.caption,w.caption)}${w.caption?`<figcaption>${esc(w.caption)}</figcaption>`:""}</figure>`).join("")}</div>
</div></section>`;

// services
h += `<section class="services" id="services"><div class="wrap">
  <div class="sec-head"><h2>${T.services}</h2></div>
  <div class="svc"><ul>${S.services.map((s,i)=>`<li><h3>${esc(s.name)}</h3>${s.text?`<p>${esc(s.text)}</p>`:""}<button data-svc="${i}">${T.ask}</button></li>`).join("")}</ul></div>
</div></section>`;

// steps
if (S.steps.length) h += `<section id="how"><div class="wrap">
  <div class="sec-head"><h2>${T.how}</h2></div>
  <div class="steps">${S.steps.map(s=>`<div><h3>${esc(s.name)}</h3><p>${esc(s.text)}</p></div>`).join("")}</div>
</div></section>`;

// quote slip
h += `<section class="quote" id="quote"><div class="wrap quote-grid">
  <div>
    <div class="sec-head"><h2>${T.qTitle}</h2><p class="lead">${esc(T.qLead)}</p></div>
    <form class="form" id="qform">
      <fieldset><legend>${T.job}</legend><div class="chips" id="qjob">${S.services.map((s,i)=>`<button type="button" class="chip" aria-pressed="false" data-i="${i}">${esc(s.name)}</button>`).join("")}</div></fieldset>
      <div class="two">
        <label><span class="flabel">${T.where}</span><input id="qwhere" placeholder="${T.wherePh}" list="arealist"></label>
        <label><span class="flabel">${T.name}</span><input id="qname" placeholder="${T.namePh}" autocomplete="given-name"></label>
      </div>
      <datalist id="arealist">${S.areas.map(a=>`<option value="${esc(a)}">`).join("")}</datalist>
      <fieldset><legend>${T.when}</legend><div class="chips" id="qwhen">${S.quote.when.map(w=>`<button type="button" class="chip" aria-pressed="false">${esc(w)}</button>`).join("")}</div></fieldset>
      <label><span class="flabel">${T.details}</span><textarea id="qdetails" rows="3" placeholder="${T.detailsPh}"></textarea></label>
    </form>
  </div>
  <aside class="slip" aria-live="polite">
    <div class="slip-top"><span>${T.slipTop}</span><span>→ ${esc(S.owner)}</span></div>
    <div class="slip-body">
      <pre id="qmsg"></pre>
      ${S.quote.note?`<small>${esc(S.quote.note)}</small>`:""}
      <a class="btn btn-mark" id="qsend" href="#" target="_blank" rel="noopener">${waIco}${T.send}</a>
    </div>
    <div class="slip-perf" aria-hidden="true"></div>
  </aside>
</div></section>`;

// info
const cols = [];
if (S.areas.length) cols.push(`<div><h3>${T.areas}</h3><ul class="areas">${S.areas.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>`);
if (S.review.text) cols.push(`<div><h3>${T.said}</h3><blockquote>“${esc(S.review.text)}”<cite>${esc(S.review.name)}, Google</cite></blockquote></div>`);
cols.push(`<div><h3>${T.hoursT}</h3>${S.hours.length?`<table class="hours">${S.hours.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>`:""}
  <div class="contact-lines">${S.phone?`<a href="${tel}">${esc(S.phone)}</a>`:""}${S.whatsapp?`<a href="https://wa.me/${esc(S.whatsapp)}">WhatsApp</a>`:""}${S.email?`<a href="mailto:${esc(S.email)}">${esc(S.email)}</a>`:""}</div></div>`);
h += `<div class="tape" aria-hidden="true"></div><section id="info"><div class="wrap info-grid">${cols.join("")}</div></section></main>`;
h += `<footer><div class="wrap"><span>© ${esc(S.name)} · ${esc(S.area)}</span>${S.demo?`<span>Demo by <a href="https://hellozara.solutions">Hello Zara</a></span>`:""}</div></footer>`;
$("#app").innerHTML = h;

/* ---------- quote slip ---------- */
const picked = {job:new Set(), when:""};
function buildMsg(){
  const jobs=[...picked.job].map(i=>S.services[i].name);
  const n=$("#qname").value.trim(), w=$("#qwhere").value.trim(), d=$("#qdetails").value.trim();
  const af=S.lang==="af", L=[];
  L.push(af?`Hallo ${S.owner}${n?`, dis ${n}`:""}! Ek wil graag 'n kwotasie hê${jobs.length?` vir: ${jobs.join(", ")}`:""}.`
          :`Hi ${S.owner}${n?`, this is ${n}`:""}! I'd like a quote${jobs.length?` for: ${jobs.join(", ")}`:""}.`);
  if(w) L.push((af?"Waar: ":"Where: ")+w);
  if(picked.when) L.push((af?"Wanneer: ":"When: ")+picked.when);
  if(d) L.push((af?"Besonderhede: ":"Details: ")+d);
  return L.join("\n");
}
function refresh(){const m=buildMsg();$("#qmsg").textContent=m;$("#qsend").href="https://wa.me/"+S.whatsapp+"?text="+encodeURIComponent(m);}
$("#qjob").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const i=+b.dataset.i;
  picked.job.has(i)?picked.job.delete(i):picked.job.add(i);b.setAttribute("aria-pressed",picked.job.has(i));refresh();});
$("#qwhen").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;
  $("#qwhen").querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));
  if(picked.when===b.textContent){picked.when="";}else{picked.when=b.textContent;b.setAttribute("aria-pressed","true");}refresh();});
$("#qform").addEventListener("input",refresh);
function pickService(i){picked.job.add(i);const b=$(`#qjob .chip[data-i="${i}"]`);if(b)b.setAttribute("aria-pressed","true");refresh();
  $("#quote").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});setTimeout(()=>$("#qwhere").focus({preventScroll:true}),400);}
document.querySelectorAll("[data-svc]").forEach(b=>b.addEventListener("click",()=>pickService(+b.dataset.svc)));
refresh();

/* ---------- Zara: scripted demo chat, answers only from config ---------- */
const af=S.lang==="af", log=$("#log"), chat=$("#chat");
$("#zaraLbl").textContent=T.askZara;$("#chatTitle").textContent="Zara · "+S.short;$("#chatSub").textContent=T.chatSub;
$("#chatNote").textContent=T.chatNote;$("#askIn").placeholder=T.typeQ;$("#askBtn").textContent=T.sendB;
function say(t,who="z"){const m=document.createElement("div");m.className="msg "+who;m.textContent=t;log.appendChild(m);log.scrollTop=log.scrollHeight;}
function openChat(){chat.classList.add("open");$("#zaraOpen").setAttribute("aria-expanded","true");if(!log.children.length){say(T.hi);quick();}$("#askIn").focus();}
function closeChat(){chat.classList.remove("open");$("#zaraOpen").setAttribute("aria-expanded","false");$("#zaraOpen").focus();}
$("#zaraOpen").onclick=()=>chat.classList.contains("open")?closeChat():openChat();
$("#zaraClose").onclick=closeChat;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&chat.classList.contains("open"))closeChat();});
function quick(){$("#quick").innerHTML=[T.qQuote,T.qArea,T.qHours,T.qPrice].map(q=>`<button type="button">${esc(q)}</button>`).join("");
  $("#quick").querySelectorAll("button").forEach(b=>b.onclick=()=>{say(b.textContent,"u");setTimeout(()=>answer(b.textContent),350);});}
const seen = af?`Ek sal sorg dat ${S.owner} dit sien.`:`I'll make sure ${S.owner} sees it.`;
const A={
  area: S.areas.length?(af?`Ja, ${S.short} werk in ${S.areas.join(", ")}. Is jy in een van dié areas?`:`Yes, ${S.short} works in ${S.areas.join(", ")}. Are you in one of those areas?`):seen,
  hours: S.hours.length?S.hours.map(r=>r[0]+": "+r[1]).join("\n")+(af?"\n\nEk antwoord self enige tyd, ook ná ure.":"\n\nI answer any time, even after hours."):seen,
  price: af?`Elke werk word gemeet en gekwoteer, so ${S.owner} gee jou 'n regte prys ná hy of sy gesien het wat nodig is. Vertel my wat jy in gedagte het, dan begin ek jou kwotasie.`
           :`Every job is measured and quoted, so ${S.owner} gives you a real price once they've seen what's needed. Tell me what you have in mind and I'll start your quote.`,
  services: (af?"Ons doen: ":"We do: ")+S.services.map(s=>s.name).join(", ")+"."
};
let step=null, lead={};
function answer(q){
  const l=q.toLowerCase();
  if(step) return flow(q);
  if(/quote|kwot|book|price for|need a|wil 'n/.test(l)) return startQuote();
  if(/where|area|come to|kom.*na|waar|areas|dorp/.test(l)) return say(A.area);
  if(/hour|open|time|when are|ure|oop|tyd/.test(l)) return say(A.hours);
  if(/price|cost|how much|r\d|prys|hoeveel|kos/.test(l)) return say(A.price);
  if(/what do|services|offer|doen julle|dienste/.test(l)) return say(A.services);
  for(const f of S.faq){ if(f.a && new RegExp(f.q,"i").test(l)) return say(f.a); }
  const s=S.services.findIndex(x=>l.includes(x.name.toLowerCase().split(" ")[0]));
  if(s>=0){lead.job=S.services[s].name;return startQuote(true);}
  say(af?`Goeie vraag. ${seen} Wil jy hê ek moet sommer 'n kwotasie vir jou begin?`:`Good question. ${seen} Would you like me to start a quote for you while you wait?`);
}
function startQuote(haveJob){
  if(haveJob){step="where";return say(af?`${lead.job}, reg so. In watter voorstad of dorp is dit?`:`${lead.job}, got it. Which suburb or town is it in?`);}
  step="job";say(af?`Lekker. Wat moet gedoen word? (${S.services.map(s=>s.name).join(", ")})`:`Great. What needs doing? (${S.services.map(s=>s.name).join(", ")})`);
}
function flow(q){
  if(step==="job"){lead.job=q;step="where";return say(af?"In watter voorstad of dorp is dit?":"Which suburb or town is it in?");}
  if(step==="where"){lead.where=q;step="name";return say(af?"En jou naam?":"And your name?");}
  if(step==="name"){lead.name=q;step=null;
    say(af?`Dankie, ${q}! Ek het dit vir ${S.owner} gestuur: ${lead.job} in ${lead.where}. Stuur gerus nou foto's van die spasie op WhatsApp, dan is jou kwotasie vinniger.`
          :`Thanks, ${q}! I've passed this to ${S.owner}: ${lead.job} in ${lead.where}. Feel free to WhatsApp a few photos of the space so your quote is quicker.`);
    setTimeout(()=>say(af?`Demo: in die regte weergawe kry ${S.owner} dit dadelik, die kontak word gestoor, en jy kry 'n opvolg as niemand gou antwoord nie. Ook om 21:00 op 'n Sondag.`
                         :`Demo: in the live version ${S.owner} gets this straight away, the contact is saved, and you get a follow-up if nobody answers quickly. Even at 9pm on a Sunday.`),700);
    lead={};}
}
$("#ask").addEventListener("submit",e=>{e.preventDefault();const v=$("#askIn").value.trim();if(!v)return;say(v,"u");$("#askIn").value="";setTimeout(()=>answer(v),350);});
</script>
</body>
</html>
